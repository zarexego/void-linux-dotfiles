[global/wm]
margin-top = 0
margin-bottom = 0

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = #1a1a1aEE
foreground = #c0caf5
line-size = 2
line-color = #7aa2f7
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1
font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "Noto Sans:size=9;3"
modules-left = i3
modules-center = date
modules-right = network sep pulse sep battery

[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false
label-focused = %index%
label-focused-foreground = #1a1a1a
label-focused-background = #7aa2f7
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = #565f89
label-unfocused-padding = 2
label-visible = %index%
label-visible-foreground = #565f89
label-visible-padding = 2
label-urgent = %index%
label-urgent-foreground = #1a1a1a
label-urgent-background = #f7768e
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 10
date = "%d.%m.%Y"
time = "%H:%M"
label = " %date%  %time%"

[module/network]
type = internal/network
interface = wlp2s0
interval = 3
format-connected = " <label-connected>"
format-disconnected = " <label-disconnected>"
label-connected = "%essid%"
label-disconnected = "offline"
label-disconnected-foreground = #f7768e

[module/pulse]
type = internal/pulseaudio
format-volume = " <label-volume>"
label-volume = "%percentage%%"
label-muted = " muted"
label-muted-foreground = #565f89

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
format-charging = " <label-charging>"
format-discharging = " <label-discharging>"
format-full = " <label-full>"
label-charging = "%percentage%%"
label-discharging = "%percentage%%"
label-full = "100%"

[module/sep]
type = custom/text
content = "|"
content-foreground = #414868
content-padding = 1

[settings]
screenchange-reload = true
pseudo-transparency = false
